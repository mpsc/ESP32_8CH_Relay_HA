name: Compilar firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: ESP32 (esp32:esp32:esp32)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Instalar o core ESP32
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Instalar as bibliotecas
        run: |
          arduino-cli lib install PubSubClient
          arduino-cli lib install ArduinoJson

      # O repositório se chama ESP32_8CH_Relay_HA — o mesmo nome do arquivo
      # .ino (o Arduino exige que a pasta tenha o mesmo nome do .ino).
      - name: Compilar
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings more \
            .
